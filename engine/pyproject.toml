[project]
name = "avert"
version = "0.1.0"
description = "Avert engine — detection, indexing, patching, verification"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "psycopg[binary]>=3.2",
]

[project.scripts]
avert = "avert.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "datamodel-code-generator>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avert"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["tests/fixtures", "avert/models"]

[tool.pytest.ini_options]
testpaths = ["tests"]

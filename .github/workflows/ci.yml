name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: avert
          POSTGRES_PASSWORD: avert
          POSTGRES_DB: avert
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avert -d avert"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.1"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Sync engine dependencies
        working-directory: engine
        run: uv sync

      - name: Install TypeScript declaration extractor dependencies
        working-directory: engine/tools/dts-surface
        run: npm ci

      - name: Install app dependencies for shared model generation
        working-directory: app
        run: npm ci

      # STRUCTURE.md §2: generated output is committed, and CI fails if
      # regeneration produces a diff — so consumers never run codegen, but
      # drift between shared/schemas/ and engine/avert/models/ is impossible.
      - name: Check generated models are up to date
        run: |
          ./shared/generate.sh
          git diff --exit-code -- engine/avert/models app/src/types

      - name: Lint
        working-directory: engine
        run: uv run ruff check .

      # The Postgres service exercises incremental persistence and impact
      # joins; the remaining unit and experiment harness tests run offline.
      - name: Test
        working-directory: engine
        run: uv run pytest -v

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app
        run: npm test

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Build
        working-directory: app
        run: npm run build
